apiVersion: v1
kind: Secret
metadata:
  name: real-time-threat-detection-secrets
  namespace: production # Change this to match the environment (e.g., dev, staging, prod)
  labels:
    app: real-time-threat-detection
    environment: production # Ensure proper environment separation
type: Opaque
data:
  # API keys and sensitive credentials should be base64 encoded.
  # Use `echo -n "your-value" | base64` to encode values.
  
  # Example: API key for a third-party service
  THIRD_PARTY_API_KEY: ${THIRD_PARTY_API_KEY} # Replace with base64-encoded value or use environment variable
  
  # Database credentials
  DB_USERNAME: ${DB_USERNAME} # Replace with base64-encoded value or use environment variable
  DB_PASSWORD: ${DB_PASSWORD} # Replace with base64-encoded value or use environment variable
  DB_HOST: ${DB_HOST}         # Replace with base64-encoded value or use environment variable
  DB_PORT: ${DB_PORT}         # Replace with base64-encoded value or use environment variable
  
  # JWT secret for authentication
  JWT_SECRET: ${JWT_SECRET} # Replace with base64-encoded value or use environment variable
  
  # Encryption key for sensitive data
  ENCRYPTION_KEY: ${ENCRYPTION_KEY} # Replace with base64-encoded value or use environment variable
  
  # SMTP credentials for email notifications
  SMTP_USERNAME: ${SMTP_USERNAME} # Replace with base64-encoded value or use environment variable
  SMTP_PASSWORD: ${SMTP_PASSWORD} # Replace with base64-encoded value or use environment variable
  SMTP_HOST: ${SMTP_HOST}         # Replace with base64-encoded value or use environment variable
  SMTP_PORT: ${SMTP_PORT}         # Replace with base64-encoded value or use environment variable

  # Redis cache credentials
  REDIS_HOST: ${REDIS_HOST}       # Replace with base64-encoded value or use environment variable
  REDIS_PORT: ${REDIS_PORT}       # Replace with base64-encoded value or use environment variable
  REDIS_PASSWORD: ${REDIS_PASSWORD} # Replace with base64-encoded value or use environment variable

  # Monitoring and logging service keys
  MONITORING_API_KEY: ${MONITORING_API_KEY} # Replace with base64-encoded value or use environment variable
  LOGGING_API_KEY: ${LOGGING_API_KEY}       # Replace with base64-encoded value or use environment variable

  # Example of a sensitive configuration for Python application
  PYTHON_APP_SECRET: ${PYTHON_APP_SECRET} # Replace with base64-encoded value or use environment variable

  # Example of a sensitive configuration for JavaScript application
  JS_APP_SECRET: ${JS_APP_SECRET} # Replace with base64-encoded value or use environment variable

  # Docker registry credentials
  DOCKER_REGISTRY_USERNAME: ${DOCKER_REGISTRY_USERNAME} # Replace with base64-encoded value or use environment variable
  DOCKER_REGISTRY_PASSWORD: ${DOCKER_REGISTRY_PASSWORD} # Replace with base64-encoded value or use environment variable

# Notes:
# 1. Always use environment variables to inject sensitive data into the Kubernetes Secret manifest.
# 2. Ensure that the namespace matches the target environment (e.g., dev, staging, prod).
# 3. Use tools like `kubectl` or CI/CD pipelines to manage and apply secrets securely.
# 4. Avoid committing actual sensitive values to version control. Use placeholders like ${VAR} and inject them securely during deployment.
# 5. Use Kubernetes RBAC to restrict access to secrets.
# 6. Consider enabling Kubernetes Secret encryption at rest for additional security.