version: "3.9" # Use the latest stable version of Docker Compose

# Docker Compose configuration for Real-Time Cyber Threat Detection and Response System
# This configuration is designed for a local development environment with production-ready practices.

services:
  # Python Backend Service
  backend:
    image: python:3.10-slim
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000" # Map local port 8000 to container port 8000
    volumes:
      - ./backend:/app # Mount local code for hot-reloading
    environment:
      - ENV=development # Set environment (development, staging, production)
      - DEBUG=True # Enable debug mode for development
      - DATABASE_URL=${DATABASE_URL} # Database connection string
      - REDIS_URL=${REDIS_URL} # Redis connection string
      - SECRET_KEY=${SECRET_KEY} # Application secret key
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - db
      - redis
    restart: always # Automatically restart the container on failure
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # JavaScript Frontend Service
  frontend:
    image: node:18-alpine
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000" # Map local port 3000 to container port 3000
    volumes:
      - ./frontend:/app # Mount local code for hot-reloading
      - /app/node_modules # Exclude node_modules from hot-reloading
    environment:
      - ENV=development
      - API_URL=http://localhost:8000/api # Backend API URL
    command: npm start
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432" # Map local port 5432 to container port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persist database data
    environment:
      - POSTGRES_USER=${POSTGRES_USER} # Database username
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} # Database password
      - POSTGRES_DB=${POSTGRES_DB} # Default database name
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379" # Map local port 6379 to container port 6379
    volumes:
      - redis_data:/data # Persist Redis data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Celery Worker Service (Task Queue)
  worker:
    image: python:3.10-slim
    container_name: worker
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - redis
      - db
    environment:
      - ENV=development
      - BROKER_URL=${REDIS_URL} # Redis URL for Celery broker
      - RESULT_BACKEND=${REDIS_URL} # Redis URL for Celery result backend
      - DATABASE_URL=${DATABASE_URL} # Database connection string
      - SECRET_KEY=${SECRET_KEY} # Application secret key
    command: celery -A app.worker worker --loglevel=info
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data: # Volume for PostgreSQL data persistence
  redis_data: # Volume for Redis data persistence